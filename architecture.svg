<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 480" font-family="Segoe UI, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="480" fill="#ffffff"/>

  <!-- ===================== ROW 1: pipeline ===================== -->
  <!-- INGESTA -->
  <g>
    <rect x="20" y="20" width="250" height="140" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="145" y="46" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">INGESTA</text>
    <text x="145" y="74" text-anchor="middle" font-size="12.5" fill="#334155">Steam Web API</text>
    <text x="145" y="94" text-anchor="middle" font-size="12.5" fill="#334155">Steam Store API</text>
    <text x="145" y="118" text-anchor="middle" font-size="11.5" fill="#64748b">(usuario semilla</text>
    <text x="145" y="134" text-anchor="middle" font-size="11.5" fill="#64748b">→ amigos)</text>
  </g>

  <!-- ALMACENAMIENTO -->
  <g>
    <rect x="320" y="20" width="250" height="140" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="445" y="46" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">ALMACENAMIENTO</text>
    <text x="445" y="80" text-anchor="middle" font-size="12.5" fill="#334155">interacciones.csv</text>
    <text x="445" y="102" text-anchor="middle" font-size="12.5" fill="#334155">metadata.csv</text>
  </g>

  <!-- PROCESAMIENTO -->
  <g>
    <rect x="620" y="20" width="270" height="140" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <text x="755" y="46" text-anchor="middle" font-size="15" font-weight="700" fill="#1d4ed8">PROCESAMIENTO</text>
    <text x="755" y="72" text-anchor="middle" font-size="12" fill="#334155">limpieza · imputación</text>
    <text x="755" y="92" text-anchor="middle" font-size="12" fill="#334155">filtro sparsity</text>
    <text x="755" y="112" text-anchor="middle" font-size="12" fill="#334155">log(1+t) + Min-Max [1,5]</text>
    <text x="755" y="132" text-anchor="middle" font-size="12" fill="#334155">matriz CSR</text>
  </g>

  <!-- MODELADO -->
  <g>
    <rect x="920" y="20" width="240" height="140" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
    <text x="1040" y="46" text-anchor="middle" font-size="15" font-weight="700" fill="#3730a3">MODELADO</text>
    <text x="1040" y="72" text-anchor="middle" font-size="12" fill="#334155">SVD truncado</text>
    <text x="1040" y="92" text-anchor="middle" font-size="12" fill="#334155">TF-IDF + coseno</text>
    <text x="1040" y="112" text-anchor="middle" font-size="12" fill="#334155">Híbrido v1 / v2</text>
  </g>

  <!-- arrows row 1 -->
  <line x1="272" y1="90" x2="316" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="572" y1="90" x2="616" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="892" y1="90" x2="916" y2="90" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- joblib arrow down from MODELADO -->
  <line x1="1040" y1="160" x2="1040" y2="232" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="1052" y="200" font-size="12" fill="#64748b" font-style="italic">joblib</text>

  <!-- ===================== ROW 2: serving ===================== -->
  <!-- Usuario final -->
  <g>
    <rect x="20" y="240" width="210" height="90" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="125" y="290" text-anchor="middle" font-size="15" font-weight="700" fill="#334155">Usuario final</text>
  </g>

  <!-- Streamlit -->
  <g>
    <rect x="440" y="230" width="260" height="110" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
    <text x="570" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#b91c1c">Streamlit :8501</text>
    <text x="570" y="286" text-anchor="middle" font-size="12.5" fill="#334155">src/app.py</text>
    <text x="570" y="308" text-anchor="middle" font-size="11" fill="#64748b">interfaz interactiva</text>
  </g>

  <!-- FastAPI -->
  <g>
    <rect x="900" y="230" width="260" height="110" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="1030" y="262" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">FastAPI :8000</text>
    <text x="1030" y="286" text-anchor="middle" font-size="12.5" fill="#334155">src/api.py</text>
    <text x="1030" y="308" text-anchor="middle" font-size="11" fill="#64748b">recommender.pkl</text>
  </g>

  <!-- arrows row 2 (right to left) -->
  <line x1="896" y1="285" x2="704" y2="285" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="436" y1="285" x2="234" y2="285" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="335" y="270" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">HTTP/JSON</text>

  <!-- footer -->
  <text x="20" y="440" font-size="12.5" fill="#475569">Metodología basada en CRISP-DM: comprensión del problema → obtención de datos → preparación →</text>
  <text x="20" y="460" font-size="12.5" fill="#475569">ingeniería de características → modelado → despliegue → evaluación → reproducibilidad.</text>
</svg>
